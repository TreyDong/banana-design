name: One-time Banana Design 0.10.1 release assets
on: workflow_dispatch
permissions:
  contents: read
jobs:
  upload-audited-assets:
    if: github.repository == 'TreyDong/banana-design'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 96a7436fe36368189dc96f959f82d4e7a26f818e
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Verify the exact audited asset hashes
        run: |
          echo '3a6734075ce5609d1d26e4de3f13451b3365d7c67ee0d28bc3918ec6872dc838  main.js' | sha256sum --check
          echo 'd8348c5d7fcae25e4a24956b8534d2a906a849fc6d1e1f8f74ecf98a226b8c0b  manifest.json' | sha256sum --check
          echo '1898a31150b86da020d843ae1539eda70aea11e7d960fcbe219a97fc1b7ca845  styles.css' | sha256sum --check
      - name: Upload only the existing 0.10.1 draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: TreyDong/banana-design
        run: gh release upload 0.10.1 main.js manifest.json styles.css --clobber
